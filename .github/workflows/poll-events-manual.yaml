name: Poll events (manually)

env:
  NODE_VERSION: 22.17.0

on: workflow_dispatch

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install package
        timeout-minutes: 10
        run: yarn install

      - name: Build package
        timeout-minutes: 5
        run: yarn build

      - name: Poll Github events
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLLECTION_PATH: ./stats-data
          REPO: AdguardTeam/AdguardFilters
        run: yarn poll
      - name: commit artifacts
        timeout-minutes: 5
        uses: EndBug/add-and-commit@v9
        with:
          message: Events collection update
          default_author: github_actions
          # `actions/checkout` has already prepared the repository. The
          # action's default `git fetch --tags --force` takes 9-15 minutes
          # on this repository, and the commit does not depend on it.
          fetch: false
  notify:
    needs: poll
    # Run this job only if the previous job failed. A step timeout fails the
    # step, so a hung step reaches here as a failure. A job-level timeout or
    # a manual cancel leaves the result `cancelled`, and GitHub Actions
    # cannot tell them apart, so such runs are not reported.
    # Note: 'always()' is needed to run the notify job even if the poll job was failed
    if: ${{ always() && needs.poll.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          fields: workflow, repo, message, commit, author, eventName, ref, job
          job_name: poll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
