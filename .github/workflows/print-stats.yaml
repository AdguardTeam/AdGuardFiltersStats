name: Print stats

env:
  NODE_VERSION: 22.17.0

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository path'
        required: true
        type: string
        default: 'AdguardTeam/AdguardFilters'
      since:
        description: 'Timestamp to search from'
        required: false
        type: string
        default: '2022-05-01T00:00:00Z'
      until:
        description: 'Timestamp to search to'
        required: false
        type: string
        default: '2022-06-01T00:00:00Z'

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install package
        timeout-minutes: 10
        run: yarn install

      - name: Build package
        timeout-minutes: 5
        run: yarn build

      - name: Print repo stats
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLLECTION_PATH: ./stats-data
          REPO: ${{ github.event.inputs.repo }}
          SINCE: ${{ github.event.inputs.since }}
          UNTIL: ${{ github.event.inputs.until }}
        run: yarn stats
  notify:
    needs: stats
    # Run this job only if the previous job failed. A step timeout fails the
    # step, so a hung step reaches here as a failure. A job-level timeout or
    # a manual cancel leaves the result `cancelled`, and GitHub Actions
    # cannot tell them apart, so such runs are not reported.
    # Note: 'always()' is needed to run the notify job even if the previous job was failed
    if: ${{ always() && needs.stats.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          fields: workflow, repo, message, commit, author, eventName, ref, job
          job_name: stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
